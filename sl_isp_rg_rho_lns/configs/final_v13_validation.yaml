# RG-ALNS — Final Validation
# 13 algorithms × 36 instances (3 pressure × 3 machine × 4 job) × 15 seeds = 7020 runs

pilot:
  name: "RG-ALNS Final Validation"
  seed: 42
  experiment_mode: "normal"
  num_seeds: 15

instances:
  medium:
    label: "Medium Pressure"
    rho_range: [0.75, 0.85]
    deadline_tightness: 1.0
    effective_due_spread: 0.50
    weight_pattern: "mild"
    arrival_intensity: "medium"
    num_entities: 3
    ops_per_job: [2, 4]
    proc_time_range: [10, 50]
    transport_delay_range: [10, 40]
    eligible_machines_range: [2, 3]
    alpha: 1.0
    beta: 1.0
    combinations:
      - {num_jobs: 40,  num_machines: 5,  num_entities: 3}
      - {num_jobs: 80,  num_machines: 5,  num_entities: 5}
      - {num_jobs: 120, num_machines: 5,  num_entities: 8}
      - {num_jobs: 160, num_machines: 5,  num_entities: 10}
      - {num_jobs: 40,  num_machines: 10, num_entities: 3, eligible_machines_range: [3, 6]}
      - {num_jobs: 80,  num_machines: 10, num_entities: 5, eligible_machines_range: [3, 6]}
      - {num_jobs: 120, num_machines: 10, num_entities: 8, eligible_machines_range: [3, 6]}
      - {num_jobs: 160, num_machines: 10, num_entities: 10, eligible_machines_range: [3, 6]}
      - {num_jobs: 40,  num_machines: 15, num_entities: 3, eligible_machines_range: [4, 8]}
      - {num_jobs: 80,  num_machines: 15, num_entities: 5, eligible_machines_range: [4, 8]}
      - {num_jobs: 120, num_machines: 15, num_entities: 8, eligible_machines_range: [4, 8]}
      - {num_jobs: 160, num_machines: 15, num_entities: 10, eligible_machines_range: [4, 8]}

  high:
    label: "High Pressure"
    rho_range: [0.85, 0.95]
    deadline_tightness: 0.5
    effective_due_spread: 0.60
    weight_pattern: "mild"
    arrival_intensity: "medium"
    num_entities: 3
    ops_per_job: [2, 4]
    proc_time_range: [10, 50]
    transport_delay_range: [10, 40]
    eligible_machines_range: [2, 3]
    alpha: 1.0
    beta: 1.0
    combinations:
      - {num_jobs: 40,  num_machines: 5,  num_entities: 3}
      - {num_jobs: 80,  num_machines: 5,  num_entities: 5}
      - {num_jobs: 120, num_machines: 5,  num_entities: 8}
      - {num_jobs: 160, num_machines: 5,  num_entities: 10}
      - {num_jobs: 40,  num_machines: 10, num_entities: 3, eligible_machines_range: [3, 6]}
      - {num_jobs: 80,  num_machines: 10, num_entities: 5, eligible_machines_range: [3, 6]}
      - {num_jobs: 120, num_machines: 10, num_entities: 8, eligible_machines_range: [3, 6]}
      - {num_jobs: 160, num_machines: 10, num_entities: 10, eligible_machines_range: [3, 6]}
      - {num_jobs: 40,  num_machines: 15, num_entities: 3, eligible_machines_range: [4, 8]}
      - {num_jobs: 80,  num_machines: 15, num_entities: 5, eligible_machines_range: [4, 8]}
      - {num_jobs: 120, num_machines: 15, num_entities: 8, eligible_machines_range: [4, 8]}
      - {num_jobs: 160, num_machines: 15, num_entities: 10, eligible_machines_range: [4, 8]}

  very_high:
    label: "Very High Pressure"
    rho_range: [0.95, 0.99]
    deadline_tightness: 0.25
    effective_due_spread: 0.70
    weight_pattern: "mild"
    arrival_intensity: "medium"
    num_entities: 3
    ops_per_job: [2, 4]
    proc_time_range: [10, 50]
    transport_delay_range: [10, 40]
    eligible_machines_range: [2, 3]
    alpha: 1.0
    beta: 1.0
    combinations:
      - {num_jobs: 40,  num_machines: 5,  num_entities: 3}
      - {num_jobs: 80,  num_machines: 5,  num_entities: 5}
      - {num_jobs: 120, num_machines: 5,  num_entities: 8}
      - {num_jobs: 160, num_machines: 5,  num_entities: 10}
      - {num_jobs: 40,  num_machines: 10, num_entities: 3, eligible_machines_range: [3, 6]}
      - {num_jobs: 80,  num_machines: 10, num_entities: 5, eligible_machines_range: [3, 6]}
      - {num_jobs: 120, num_machines: 10, num_entities: 8, eligible_machines_range: [3, 6]}
      - {num_jobs: 160, num_machines: 10, num_entities: 10, eligible_machines_range: [3, 6]}
      - {num_jobs: 40,  num_machines: 15, num_entities: 3, eligible_machines_range: [4, 8]}
      - {num_jobs: 80,  num_machines: 15, num_entities: 5, eligible_machines_range: [4, 8]}
      - {num_jobs: 120, num_machines: 15, num_entities: 8, eligible_machines_range: [4, 8]}
      - {num_jobs: 160, num_machines: 15, num_entities: 10, eligible_machines_range: [4, 8]}

algorithms:
  # ── Dispatching Rules ───────────────────────────────────────────
  edd:  {type: "dispatching", label: "EDD"}
  spt:  {type: "dispatching", label: "SPT"}
  wspt: {type: "dispatching", label: "WSPT"}
  atc:  {type: "dispatching", label: "ATC"}

  # ── Service-Oriented Rules ──────────────────────────────────────
  swd: {type: "dispatching", label: "Service-Weighted"}
  sfg: {type: "dispatching", label: "Shortfall-Greedy"}

  # ── Rolling-Horizon Heuristic ────────────────────────────────────
  plain_rho_fast:
    type: "rho_fast"
    label: "Plain-RHO-Fast"
    horizon: 300

  # ── LNS Baseline ─────────────────────────────────────────────────
  rho_lns_fast:
    type: "rho_lns_fast"
    label: "RHO-LNS-Fast"
    horizon: 300
    lns_iterations: 20

  # ── RG Variant (pre-multi-start) ─────────────────────────────────
  adaptive_rg_rho_lns_fast:
    type: "adaptive_rg_rho_lns_fast"
    label: "Adaptive-RG-v1.2"
    horizon: 300
    lns_iterations: 20

  # ── Adapted Metaheuristic Baselines ──────────────────────────────
  ils_fast:
    type: "ils_fast"
    label: "ILS-Fast"
    horizon: 300
    max_iter: 20

  vns_fast:
    type: "vns_fast"
    label: "VNS-Fast"
    horizon: 300
    max_iter: 20

  ts_fast:
    type: "ts_fast"
    label: "TS-Fast"
    horizon: 300
    max_iter: 20
    tabu_tenure: 7

  # ── Proposed Method ──────────────────────────────────────────────
  rg_alns:
    type: "rg_alns"
    label: "RG-ALNS"
    horizon: 300
    lns_iterations: 20
    exact_local_job_limit: 8
    exact_local_time_limit_s: 0.2
    dispatch_mode: standard_projected

output:
  raw_csv: "outputs/final_v13_validation/final_raw.csv"
  convergence_raw: "outputs/final_v13_validation/convergence_raw.csv"
  initial_candidate_performance: "outputs/final_v13_validation/initial_candidate_performance.csv"
  rollout_portfolio_raw: "outputs/final_v13_validation/rollout_portfolio_raw.csv"
