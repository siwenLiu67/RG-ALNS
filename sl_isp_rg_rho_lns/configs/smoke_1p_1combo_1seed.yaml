# NR-RG-RHO-LNS smoke validation
# 1 pressure x 1 size combo x 13 algorithms x 1 seed = 13 runs

pilot:
  name: "NR-RG-RHO-LNS Smoke 1P 1Combo 1Seed"
  seed: 42
  experiment_mode: "normal"
  num_seeds: 1

instances:
  medium:
    label: "Medium Pressure"
    rho_range: [0.75, 0.85]
    deadline_tightness: 1.0
    effective_due_spread: 0.50
    weight_pattern: "mild"
    arrival_intensity: "medium"
    num_entities: 3
    ops_per_job: [2, 4]
    proc_time_range: [10, 50]
    transport_delay_range: [10, 40]
    eligible_machines_range: [2, 3]
    alpha: 1.0
    beta: 1.0
    combinations:
      - {num_jobs: 40, num_machines: 5, num_entities: 3}

algorithms:
  edd:  {type: "dispatching", label: "EDD"}
  spt:  {type: "dispatching", label: "SPT"}
  wspt: {type: "dispatching", label: "WSPT"}
  atc:  {type: "dispatching", label: "ATC"}

  swd: {type: "dispatching", label: "Service-Weighted"}
  sfg: {type: "dispatching", label: "Shortfall-Greedy"}

  plain_rho_fast:
    type: "rho_fast"
    label: "Plain-RHO-Fast"
    horizon: 300

  rho_lns_fast:
    type: "rho_lns_fast"
    label: "RHO-LNS-Fast"
    horizon: 300
    lns_iterations: 20

  adaptive_rg_rho_lns_fast:
    type: "adaptive_rg_rho_lns_fast"
    label: "Adaptive-RG-v1.2"
    horizon: 300
    lns_iterations: 20

  ils_fast:
    type: "ils_fast"
    label: "ILS-Fast"
    horizon: 300
    max_iter: 20

  vns_fast:
    type: "vns_fast"
    label: "VNS-Fast"
    horizon: 300
    max_iter: 20

  ts_fast:
    type: "ts_fast"
    label: "TS-Fast"
    horizon: 300
    max_iter: 20
    tabu_tenure: 7

  nr_rg_rho_lns:
    type: "nr_rg_rho_lns"
    label: "NR-RG-RHO-LNS"
    horizon: 300
    lns_iterations: 20
    exact_local_job_limit: 8
    exact_local_time_limit_s: 0.2
    use_rollout_portfolio: false
    rollout_inner_nr_job_limit: 30
    use_quota_rescue_rollout: true
    quota_rescue_job_threshold: 31
    quota_rescue_max_moves: 12
    use_vns_polish_rollout: true
    vns_polish_job_threshold: 80
    vns_polish_job_limit: 100
    vns_polish_max_iter: 4
    use_sequence_evolution_rollout: true
    sequence_evolution_job_limit: 30
    use_intensified_sequence_evolution: false

output:
  raw_csv: "outputs/smoke_1p_1combo_1seed/final_raw.csv"
  convergence_raw: "outputs/smoke_1p_1combo_1seed/convergence_raw.csv"
  initial_candidate_performance: "outputs/smoke_1p_1combo_1seed/initial_candidate_performance.csv"
  rollout_portfolio_raw: "outputs/smoke_1p_1combo_1seed/rollout_portfolio_raw.csv"
